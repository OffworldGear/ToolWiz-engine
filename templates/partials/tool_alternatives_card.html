<!-- Alternative tools card: static/js/tool_alternatives_v4.js, POST /api/advice/alternative_tools (docs/TOOL_RECOMMENDER.md) -->
<style>
    .ta-card { padding: 0.85rem 1rem; min-width: 0; grid-column: span 2; margin-top: 0.75rem; }
    .ta-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    .ta-head h3 { margin: 0; font-size: var(--fs-md); color: #e2e8f0; }
    .ta-run { padding: 5px 12px; background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 6px; font-weight: 600; cursor: pointer; }
    .ta-run:disabled { opacity: 0.6; cursor: progress; }
    .ta-run:focus-visible, .ta-in:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .ta-note { font-size: var(--fs-sm); color: var(--text-secondary); margin: 0.3rem 0; line-height: 1.45; overflow-wrap: anywhere; }
    .ta-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.5rem 0.75rem; margin: 0.5rem 0; align-items: end; }
    .ta-form label { margin: 0; font-size: var(--fs-xs); }
    .ta-in { width: 100%; box-sizing: border-box; padding: 5px 8px; background: rgba(15, 23, 42, 0.6); color: #e2e8f0; border: 1px solid var(--panel-border); border-radius: 6px; }
    .ta-chk { display: flex; align-items: center; gap: 0.4rem; font-size: var(--fs-sm); color: #cbd5e1; font-weight: 400; }
    .ta-list { list-style: none; margin: 0.5rem 0; padding: 0; display: grid; gap: 0.5rem; }
    .ta-item { border: 1px solid var(--panel-border); border-radius: 8px; padding: 0.55rem 0.7rem; background: rgba(15, 23, 42, 0.45); min-width: 0; }
    .ta-item.ta-lib { border-color: rgba(52, 211, 153, 0.55); }
    .ta-top { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
    .ta-gain { font-weight: 700; color: #34d399; font-size: var(--fs-md); white-space: nowrap; }
    .ta-name { font-weight: 600; color: #e2e8f0; overflow-wrap: anywhere; }
    .ta-tag { font-size: var(--fs-xs); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--panel-border); color: var(--text-secondary); white-space: nowrap; }
    .ta-nums { font-size: var(--fs-sm); color: #cbd5e1; margin: 0.25rem 0; overflow-wrap: anywhere; }
    .ta-why { font-size: var(--fs-sm); color: #e2e8f0; margin: 0.25rem 0; line-height: 1.45; overflow-wrap: anywhere; }
    .ta-more summary { cursor: pointer; font-size: var(--fs-xs); color: var(--text-secondary); }
    .ta-more ul { margin: 0.3rem 0 0; padding-left: 1.1rem; font-size: var(--fs-xs); color: var(--text-secondary); }
    .ta-none { border-left: 3px solid #94a3b8; padding: 0.4rem 0.7rem; background: rgba(148, 163, 184, 0.08); border-radius: 4px; font-size: var(--fs-sm); color: #cbd5e1; }
    .ta-none ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }
    .ta-stale { color: #fbbf24; }
</style>
<section id="toolAltCard" class="glass-panel ta-card" style="display:none;" aria-labelledby="taTitle">
    <div class="ta-head">
        <h3 id="taTitle">Alternative tools</h3>
        <button type="button" id="taRun" class="ta-run" onclick="ToolAlt.run()">Find faster tools</button>
    </div>
    <div class="ta-form">
        <div><label for="taMaxDia">Widest tool the feature allows (<span class="ta-unit">in</span>)</label><input type="number" id="taMaxDia" class="ta-in" min="0" step="any" placeholder="e.g. slot width"></div>
        <div><label for="taReach">Flute reach the depth needs (<span class="ta-unit">in</span>)</label><input type="number" id="taReach" class="ta-in" min="0" step="any" placeholder="e.g. depth"></div>
        <div><label class="ta-chk"><input type="checkbox" id="taSlot"> Full slot (as wide as the tool)</label></div>
    </div>
    <div id="taBody" role="status" aria-live="polite"><p class="ta-note">Reruns this cut with your library tools, other brands' charts, other flute counts and larger tools that fit, and lists only the ones that gain 30 % or more. Nothing runs until you press the button.</p></div>
</section>
